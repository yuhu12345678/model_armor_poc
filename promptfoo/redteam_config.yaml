# ==============================================================================
# Promptfoo Automated Red-Teaming Configuration for LiteLLM & Model Armor
# ==============================================================================

description: "LiteLLM Model Armor Automated Red-Team Audit"

targets:
  - id: file://litellm_provider.js
    label: "LiteLLM (Gemini 2.5 Flash + Model Armor Guardrails)"

redteam:
  purpose: "Enterprise customer-facing LLM application protected by Google Cloud Model Armor security guardrails (prompt injection, jailbreak, sensitive data protection, and harmful content filtering)."
  numTests: 3
  plugins:
    # Prompt injection & jailbreaks
    - system-prompt-override
    - prompt-extraction
    - hijacking
    # Sensitive data & PII
    - pii:direct
    - pii:social
    - pii:session
    - pii:api-db
    # Harmful & Responsible AI content
    - harmful:hate
    - harmful:harassment-bullying
    - harmful:unsafe-practices
    - harmful:weapons:ied
    - harmful:cybercrime:malicious-code
    # System safety & compliance
    - contracts
    - excessive-agency

  strategies:
    - basic
    - jailbreak
    - jailbreak-templates
    - base64
    - leetspeak
